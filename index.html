<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12100e" />
<title>PeanutsToon</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="apple-touch-icon" href="/logo.png"/>
<meta name="pt-version" content="1.0.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#12100e;
  --bg2:#1a1714;
  --bg3:#221e1a;
  --card:#1e1a16;
  --line:rgba(232,196,150,.12);
  --text:#f5efe6;
  --muted:#a89880;
  --peanut:#e8c496;
  --peanut2:#d4a574;
  --peanut3:#c4956a;
  --peanut-soft:rgba(232,196,150,.14);
  --peanut-glow:rgba(232,196,150,.28);
  --danger:#e07a6a;
  --ok:#8fbf7a;
  --radius:16px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;min-height:100%}
body{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
body.reading{padding-bottom:0;overflow:hidden}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* Header */
.app-header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(18,16,14,.96),rgba(18,16,14,.88));
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 14px 12px;
}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-mark{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(145deg,var(--peanut),var(--peanut3));
  display:grid;place-items:center;
  box-shadow:0 4px 16px var(--peanut-glow);
}
.logo-mark{overflow:hidden;padding:0}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block;border-radius:12px}
.logo-mark svg{width:22px;height:22px}
.brand-text{font-weight:800;font-size:1.15rem;letter-spacing:.2px}
.brand-text span{color:var(--peanut)}
.search-wrap{position:relative}
.search-wrap svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;opacity:.7;pointer-events:none
}
.search-wrap input{
  width:100%;padding:11px 12px 11px 40px;border-radius:14px;
  border:1px solid var(--line);background:var(--bg3);outline:none;
}
.search-wrap input:focus{border-color:var(--peanut3);box-shadow:0 0 0 3px var(--peanut-soft)}

/* Pages */
.page{padding:14px 14px 24px;max-width:720px;margin:0 auto}
.page-title{font-size:1.05rem;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.page-title svg{width:20px;height:20px;color:var(--peanut)}

/* Grid comics */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;
}
.card:active{transform:scale(.98)}
.card:hover{border-color:rgba(232,196,150,.35)}
.card .cover{
  aspect-ratio:3/4;background:var(--bg3);position:relative;overflow:hidden;
}
.card .cover img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:8px 8px 10px}
.card .title{
  font-size:.72rem;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.4em;
}
.card .sub{font-size:.62rem;color:var(--muted);margin-top:4px}
.badge-type{
  position:absolute;left:6px;top:6px;
  font-size:.58rem;font-weight:700;padding:3px 6px;border-radius:999px;
  background:rgba(18,16,14,.75);color:var(--peanut);border:1px solid var(--line);
}

/* List rows history/save */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px;cursor:pointer;
}
.row .thumb{width:52px;height:70px;border-radius:8px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .info .t{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .info .s{font-size:.72rem;color:var(--muted);margin-top:3px}
.row .actions{display:flex;gap:6px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg3);display:grid;place-items:center;cursor:pointer;padding:0;
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{background:var(--peanut-soft)}
.icon-btn.danger{color:var(--danger)}

/* Detail */
.detail-hero{display:flex;gap:14px;margin-bottom:14px}
.detail-cover{
  width:120px;height:168px;border-radius:14px;object-fit:cover;
  background:var(--bg3);border:1px solid var(--line);flex-shrink:0;
}
.detail-info h1{font-size:1.15rem;margin:0 0 6px;line-height:1.25}
.detail-info .meta-line{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
  font-size:.68rem;padding:4px 8px;border-radius:999px;
  background:var(--peanut-soft);color:var(--peanut);border:1px solid var(--line);
}
.synopsis{
  font-size:.84rem;line-height:1.55;color:#d8cfc0;
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:12px 0 16px;
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg3);cursor:pointer;font-weight:600;font-size:.84rem;
}
.btn svg{width:18px;height:18px}
.btn.primary{
  background:linear-gradient(135deg,var(--peanut),var(--peanut3));
  color:#1a120c;border:none;box-shadow:0 6px 20px var(--peanut-glow);
}
.btn.ghost{background:transparent}
.chap-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.chap-head h2{font-size:.95rem;margin:0}
.chap-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.chap-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;font-size:.84rem;
}
.chap-item:active{background:var(--peanut-soft)}
.chap-item .num{font-weight:600}
.chap-item .hint{font-size:.72rem;color:var(--muted)}

/* Reader */
#pageReader{
  position:fixed;inset:0;z-index:80;background:#0a0908;
  display:flex;flex-direction:column;
}
#pageReader.hidden{display:none!important}
.reader-bar{
  position:absolute;left:0;right:0;z-index:5;
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:linear-gradient(180deg,rgba(10,9,8,.92),transparent);
  transition:opacity .2s,transform .2s;
}
.reader-bar.bottom{
  top:auto;bottom:0;
  background:linear-gradient(0deg,rgba(10,9,8,.94),transparent);
  justify-content:space-between;
  padding-bottom:calc(10px + var(--safe-b));
}
.reader-bar.hide{opacity:0;pointer-events:none;transform:translateY(-8px)}
.reader-bar.bottom.hide{transform:translateY(8px)}
.reader-title{flex:1;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-scroll{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  font-size:0;line-height:0;
}
.reader-scroll img{
  width:100%;height:auto;margin:0;padding:0;display:block;background:#111;
}
.reader-nav-btn{
  min-width:42px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:rgba(30,26,22,.9);display:grid;place-items:center;cursor:pointer;
}
.reader-nav-btn:disabled{opacity:.35}
.reader-nav-btn svg{width:18px;height:18px}

/* Bottom nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  height:calc(var(--nav-h) + var(--safe-b));
  padding:6px 10px var(--safe-b);
  background:rgba(18,16,14,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:flex-start;
}
.bottom-nav button{
  flex:1;max-width:90px;border:0;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;cursor:pointer;font-size:.65rem;font-weight:600;
}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active{color:var(--peanut)}
body.reading .bottom-nav, body.reading .app-header{display:none}

/* Empty / loading */
.empty, .loading{
  text-align:center;color:var(--muted);padding:36px 16px;font-size:.9rem;
}
.loading .spin{
  width:28px;height:28px;margin:0 auto 12px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--peanut);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:.8rem;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;
  background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-size:.8rem;font-weight:600;
}
.back-btn svg{width:16px;height:16px}
.footer-note{text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;opacity:.8}

.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border,#3a2e24);background:var(--card,#1c1612);color:var(--peanut,#e8b86d);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn.subtle{width:36px;height:36px;font-size:14px;color:var(--muted,#9a8b7a)}
.search-panel{padding:0 16px 10px;background:var(--bg,#12100e)}
.search-panel.hidden{display:none}
.search-wrap.expanded{display:flex;align-items:center;gap:8px;position:relative}
.search-wrap.expanded svg{position:absolute;left:12px;width:18px;height:18px;color:var(--muted,#9a8b7a);pointer-events:none}
.search-wrap.expanded input{flex:1;padding:12px 40px 12px 40px;border-radius:14px;border:1px solid var(--border,#3a2e24);background:var(--card,#1c1612);color:#f5e6d3;font-size:15px}
.source-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid var(--border,#3a2e24);background:transparent;color:var(--muted,#9a8b7a);font-size:12px;cursor:pointer}
.chip.on{background:var(--peanut,#e8b86d);color:#1a120c;border-color:transparent;font-weight:600}
.card-source{position:absolute;left:8px;bottom:8px;font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#e8b86d;text-transform:uppercase}


.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-row{margin-bottom:0!important;flex:1;min-width:0}
.icon-btn{flex-shrink:0;width:42px;height:42px;border-radius:12px;border:1px solid var(--line,#3a2e24);background:var(--card,#1c1612);color:var(--peanut,#e8b86d);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:20px;height:20px;pointer-events:none}
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:auto}
.app-header{z-index:60}
.search-panel{position:relative;z-index:55}


.chapter-sheet{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center}
.chapter-sheet.hidden{display:none!important}
.chapter-sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.chapter-sheet-panel{position:relative;width:100%;max-width:560px;max-height:75vh;background:#161210;border-radius:18px 18px 0 0;border:1px solid var(--line,#3a2e24);display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.chapter-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line,#3a2e24);position:relative;z-index:5}
.chapter-sheet-head .icon-btn{position:relative;z-index:6;pointer-events:auto;min-width:40px;min-height:40px}
.chapter-sheet-list{overflow:auto;padding:10px 12px 20px;-webkit-overflow-scrolling:touch}
.chapter-sheet-list button{width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line,#3a2e24);background:#1c1612;color:#f5e6d3}
.chapter-sheet-list button.on{border-color:var(--peanut,#e8b86d);background:#2a2018}
.chapter-sheet-list .num{float:right;opacity:.6;font-size:.8rem}
.cover img.broken,.cover img[src=""]{opacity:.25;background:#2a2018}
.cover{position:relative;background:#1a1512}

</style>
</head>
<body>
<header class="app-header" id="appHeader">
  <div class="header-top">
    <div class="brand-row">
      <div class="logo-mark" aria-hidden="true"><img src="/logo.png" alt="" width="36" height="36"/></div>
      <div class="brand-text">Peanuts<span>Toon</span></div>
    </div>
    <button type="button" id="searchToggle" class="icon-btn" aria-label="Cari" title="Cari">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </div>
</header>
<div id="searchPanel" class="search-panel hidden">
  <div class="search-wrap expanded">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Cari Judul Komik..." autocomplete="off" />
    <button type="button" id="searchClose" class="icon-btn subtle" aria-label="Tutup">✕</button>
  </div>
  <div class="source-chips" id="sourceChips">
    <button type="button" class="chip on" data-source="all">Semua</button>
    <button type="button" class="chip" data-source="ikiru">Ikiru</button>
    <button type="button" class="chip" data-source="ainzscans">AinzScans</button>
    <button type="button" class="chip" data-source="manhwaindo">ManhwaIndo</button>
    <button type="button" class="chip" data-source="shinigami">Shinigami</button>
    <button type="button" class="chip" data-source="voratoon">Voratoon</button>
    <button type="button" class="chip" data-source="kiryuu">Kiryuu</button>
  </div>
</div>

<main>
  <!-- HOME -->
  <section id="pageHome" class="page">
    <h2 class="page-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Update terbaru
    </h2>
    <div id="homeGrid" class="grid"></div>
    <div id="homeLoading" class="loading"><div class="spin"></div>Memuat komik...</div>
    <div id="homeEmpty" class="empty hidden">Belum ada data.</div>
    <p class="footer-note">By: Nat</p>
  </section>

  <!-- SEARCH RESULTS (same page overlay content in home when searching) -->
  <section id="pageSearch" class="page hidden">
    <button class="back-btn" type="button" data-go="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      Kembali
    </button>
    <h2 class="page-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      Hasil pencarian
    </h2>
    <div id="searchGrid" class="grid"></div>
    <div id="searchLoading" class="loading hidden"><div class="spin"></div>Mencari...</div>
    <div id="searchEmpty" class="empty hidden">Tidak ditemukan.</div>
  </section>

  <!-- DETAIL -->
  <section id="pageDetail" class="page hidden">
    <button class="back-btn" type="button" id="detailBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      Kembali
    </button>
    <div id="detailBody"></div>
  </section>

  <!-- HISTORY -->
  <section id="pageHistory" class="page hidden">
    <h2 class="page-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Riwayat baca
    </h2>
    <div id="historyList" class="list"></div>
    <div id="historyEmpty" class="empty hidden">Belum ada riwayat.</div>
  </section>

  <!-- SAVED -->
  <section id="pageSaved" class="page hidden">
    <h2 class="page-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10a1 1 0 011 1v15l-6-3.5L6 20V5a1 1 0 011-1z"/></svg>
      Disimpan
    </h2>
    <div id="savedList" class="list"></div>
    <div id="savedEmpty" class="empty hidden">Belum ada yang disimpan.</div>
  </section>
</main>

<!-- READER -->
<section id="pageReader" class="hidden">
  <div class="reader-bar" id="readerTop">
    <button class="reader-nav-btn" type="button" id="readerClose" title="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="reader-title" id="readerTitle">Chapter</div>
    <button class="reader-nav-btn" type="button" id="readerListBtn" title="Daftar chapter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M5 12h14M5 17h10"/></svg>
    </button>
  </div>
  <div class="reader-scroll" id="readerScroll"></div>
  <div class="reader-bar bottom" id="readerBottom">
    <button class="reader-nav-btn" type="button" id="readerPrev" title="Sebelumnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="reader-title" id="readerPos" style="text-align:center">-</div>
    <button class="reader-nav-btn" type="button" id="readerNext" title="Selanjutnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<nav class="bottom-nav" id="bottomNav">
  <button type="button" data-tab="home" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg>
    Beranda
  </button>
  <button type="button" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Riwayat
  </button>
  <button type="button" data-tab="saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10a1 1 0 011 1v15l-6-3.5L6 20V5a1 1 0 011-1z"/></svg>
    Simpan
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const API_BASE = ""; // same origin (main.py proxy)
const LS_HISTORY = "pt_history_v1";
const LS_SAVED = "pt_saved_v1";

const $ = (id) => document.getElementById(id);
const pages = {
  home: $("pageHome"),
  search: $("pageSearch"),
  detail: $("pageDetail"),
  history: $("pageHistory"),
  saved: $("pageSaved"),
  reader: $("pageReader"),
};

let state = { source: "all", currentSource: "ikiru", searchCache: [], searchQ: "", 
  tab: "home",
  item: null,
  chapters: [],
  chapIdx: -1,
  readerUi: true,
  from: "home",
};

function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1800);
}


function normalizeChapNumber(raw, judul, slug) {
  let s = (raw != null && raw !== "") ? String(raw).trim() : "";
  // from judul: "Chapter 38", "Ch. 12.5"
  if (!s && judul) {
    const m = String(judul).match(/(?:chapter|ch\.?)\s*(\d+(?:[.,]\d+)?)/i);
    if (m) s = m[1];
  }
  if (!s && slug) {
    const m = String(slug).match(/chapter-?(\d+(?:\.\d+)?)/i) || String(slug).match(/(\d+(?:\.\d+)?)/);
    if (m) s = m[1];
  }
  if (!s) return "";
  s = s.replace(",", ".");
  // chapter-1.833534 (WP id) → 1
  if (/^\d+\.\d{5,}$/.test(s)) {
    s = s.split(".")[0];
  }
  // 38.00 / 38.0 → 38 ; keep 12.5
  if (/^\d+\.0+$/.test(s)) {
    s = s.split(".")[0];
  } else if (/^\d+\.\d+$/.test(s)) {
    const n = parseFloat(s);
    if (!isNaN(n) && n === Math.floor(n)) s = String(Math.floor(n));
    else if (!isNaN(n)) {
      // trim trailing zeros: 12.50 → 12.5
      s = String(n).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
    }
  }
  // guard absurd values from bad parse
  const n = parseFloat(s);
  if (isNaN(n) || n < 0 || n > 99999) return "";
  return s;
}
function formatChapHint(c) {
  const n = normalizeChapNumber(c && c.number, c && (c.judul || c.title), c && c.slug);
  return n ? ("Ch. " + n) : "";
}
function formatChapTitle(c) {
  const judul = (c && (c.judul || c.title)) || "";
  const n = normalizeChapNumber(c && c.number, judul, c && c.slug);
  if (judul && !/^chapter-?\d/i.test(judul.trim())) {
    // sudah nama manusiawi
    return judul;
  }
  if (n) return "Chapter " + n;
  return judul || (c && c.slug) || "Chapter";
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function showPage(name){
  Object.entries(pages).forEach(([k, el]) => {
    if (!el) return;
    if (k === "reader") return;
    el.classList.toggle("hidden", k !== name);
  });
  if (name !== "reader") {
    pages.reader.classList.add("hidden");
    document.body.classList.remove("reading");
  }
  state.tab = name;
  document.querySelectorAll("#bottomNav button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === name || (name === "search" && b.dataset.tab === "home") || (name === "detail" && b.dataset.tab === "home"));
  });
}

async function api(path, opts){
  const r = await fetch(API_BASE + path, opts || {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data && (data.detail || data.message)) || ("HTTP " + r.status));
  return data;
}

function loadLS(key){
  try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch { return []; }
}
function saveLS(key, arr){
  localStorage.setItem(key, JSON.stringify(arr.slice(0, 80)));
}

function isSaved(slug, source){
  const src = source || state.currentSource || "ikiru";
  return loadLS(LS_SAVED).some(x => x.slug === slug && (x.source || "ikiru") === src);
}
function toggleSave(item){
  let arr = loadLS(LS_SAVED);
  const src = item.source || state.currentSource || "ikiru";
  const i = arr.findIndex(x => x.slug === item.slug && (x.source || "ikiru") === src);
  if (i >= 0) {
    arr.splice(i, 1);
    saveLS(LS_SAVED, arr);
    toast("Dihapus dari simpanan");
    return false;
  }
  arr.unshift({
    slug: item.slug,
    source: src,
    judul: item.judul || item.title,
    thumbnail: item.thumbnail || item.sampul || "",
    type: item.type || "",
    savedAt: Date.now(),
  });
  saveLS(LS_SAVED, arr);
  toast("Disimpan");
  return true;
}
function pushHistory(item, chapter){
  const src = item.source || state.currentSource || "ikiru";
  let arr = loadLS(LS_HISTORY).filter(x => !(x.slug === item.slug && (x.source || "ikiru") === src));
  arr.unshift({
    slug: item.slug,
    source: src,
    judul: item.judul || item.title,
    thumbnail: item.thumbnail || "",
    type: item.type || "",
    lastChapter: chapter ? (chapter.number ?? chapter.slug) : "",
    lastChapterSlug: chapter ? (chapter.slug || "") : "",
    at: Date.now(),
  });
  saveLS(LS_HISTORY, arr);
}

function cardHtml(item){
  const thumb = item.thumbnail || item.sampul || "";
  const title = item.judul || item.title || item.slug || "-";
  const type = item.type || "";
  const source = item.source || state.currentSource || "ikiru";
  return `<article class="card" data-slug="${escapeHtml(item.slug)}" data-title="${escapeHtml(title)}" data-thumb="${escapeHtml(thumb)}" data-type="${escapeHtml(type)}" data-source="${escapeHtml(source)}">
    <div class="cover">
      <span class="badge-type">${escapeHtml(source)}</span>
      ${type ? `<span class="badge-type" style="left:auto;right:6px">${escapeHtml(type)}</span>` : ""}
      <img src="${escapeHtml(thumb)}" alt="" loading="lazy" onerror="this.style.opacity=.2" />
    </div>
    <div class="meta">
      <div class="title">${escapeHtml(title)}</div>
      <div class="sub">${escapeHtml(source)}</div>
    </div>
  </article>`;
}

function bindCards(root){
  root.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => {
      const src = el.dataset.source || state.source || "ikiru";
      state.currentSource = src;
      openDetail({
        slug: el.dataset.slug,
        judul: el.dataset.title,

        type: el.dataset.type,

}

async function loadHome(){
  const loading = $("homeLoading");
  const empty = $("homeEmpty");
  const grid = $("homeGrid");
  if (loading) loading.classList.remove("hidden");
  if (empty) empty.classList.add("hidden");
  if (grid) grid.innerHTML = "";
  const src = (state && state.source) ? state.source : "all";
  const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = setTimeout(() => { try { ctrl && ctrl.abort(); } catch(e) {} }, 25000);
  try {
    const d = await api("/api/latest?page=1&source=" + encodeURIComponent(src), ctrl ? { signal: ctrl.signal } : undefined);
    const list = (d && d.data) || [];
    if (!list.length) {
      if (empty) { empty.classList.remove("hidden"); empty.textContent = "Belum ada data."; }
    }
    if (grid) {
      grid.innerHTML = list.map(cardHtml).join("");
      bindCards(grid);
    }
  } catch (e) {
    if (empty) {
      empty.classList.remove("hidden");
      empty.textContent = "Gagal memuat: " + (e.name === "AbortError" ? "Timeout — coba lagi / pilih source lain" : (e.message || e));
    }
  } finally {
    clearTimeout(timer);
    if (loading) loading.classList.add("hidden");
  }
}

async function openDetail(item, opts={}){
  if (item && item.source) state.currentSource = item.source;
  state.from = opts.from || state.tab || "home";
  state.item = item;
  showPage("detail");
  $("detailBody").innerHTML = `<div class="loading"><div class="spin"></div>Memuat detail...</div>`;
  try {
    if (item && item.source) state.currentSource = item.source;
    const res = await api("/api/detail/" + encodeURIComponent(item.slug) + "?source=" + encodeURIComponent(item.source || state.currentSource || "ikiru"));
    const d = res.data || res;
    const judul = d.judul || item.judul || item.slug;
    const thumb = d.thumbnail || item.thumbnail || "";
    const syn = d.sinopsis || d.synopsis || "-";
    const type = d.type || item.type || "";
    const status = d.status || "";
    const chapters = Array.isArray(d.chapters) ? d.chapters : [];
    state.item = { ...item, judul, thumbnail: thumb, type, status, source: item.source || state.currentSource || res.source || "ikiru" };
    state.currentSource = state.item.source;
    state.chapters = chapters.map(c => {
      const number = normalizeChapNumber(c.number, c.judul || c.title, c.slug);
      return { ...c, number, judul: formatChapTitle({ ...c, number }) };
    });

    const saved = isSaved(item.slug, item.source || state.currentSource);
    $("detailBody").innerHTML = `
      <div class="detail-hero">
        <img class="detail-cover" src="${escapeHtml(thumb)}" alt="" onerror="this.style.opacity=.25" />
        <div class="detail-info">
          <h1>${escapeHtml(judul)}</h1>
          <div class="meta-line">${escapeHtml([item.source || state.currentSource || "", type, status].filter(Boolean).join(" · ") || "PeanutsToon")}</div>
          <div class="meta-line">${chapters.length} chapter</div>
          <div class="btn-row">
            <button type="button" class="btn primary" id="btnReadFirst">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5l12 7-12 7V5z"/></svg>
              Baca
            </button>
            <button type="button" class="btn" id="btnToggleSave">
              <svg viewBox="0 0 24 24" fill="${saved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M7 4h10a1 1 0 011 1v15l-6-3.5L6 20V5a1 1 0 011-1z"/></svg>
              ${saved ? "Tersimpan" : "Simpan"}
            </button>
          </div>
        </div>
      </div>
      <div class="synopsis">${escapeHtml(syn)}</div>
      <div class="chap-head"><h2>Daftar chapter</h2></div>
      <div class="chap-list" id="chapList">
        ${chapters.map((c, idx) => `
          <div class="chap-item" data-idx="${idx}">
            <span class="num">${escapeHtml(formatChapTitle(c))}</span>
            <span class="hint">${escapeHtml(formatChapHint(c))}</span>
          </div>`).join("") || `<div class="empty">Chapter kosong</div>`}
      </div>`;

    $("btnToggleSave").onclick = () => {
      const on = toggleSave(state.item);
      $("btnToggleSave").innerHTML = `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M7 4h10a1 1 0 011 1v15l-6-3.5L6 20V5a1 1 0 011-1z"/></svg> ${on ? "Tersimpan" : "Simpan"}`;
    };
    $("btnReadFirst").onclick = () => {
      if (!state.chapters.length) return toast("Chapter kosong");
      // chapters often newest-first
      openChapter(0);
    };
    $("chapList").querySelectorAll(".chap-item").forEach(el => {
      el.addEventListener("click", () => openChapter(Number(el.dataset.idx)));
    });

    if (opts.chapterSlug) {
      const idx = state.chapters.findIndex(c => String(c.slug) === String(opts.chapterSlug) || String(c.number) === String(opts.chapterSlug));
      if (idx >= 0) openChapter(idx);
    }
  } catch (e) {
    $("detailBody").innerHTML = `<div class="empty">Gagal memuat detail: ${escapeHtml(e.message)}</div>`;
  }
}

let _readerUiTimer = null;
function setReaderUi(show, autoHideMs){
  state.readerUi = !!show;
  const top = $("readerTop");
  const bot = $("readerBottom");
  if (top) top.classList.toggle("hide", !show);
  if (bot) bot.classList.toggle("hide", !show);
  if (_readerUiTimer) { clearTimeout(_readerUiTimer); _readerUiTimer = null; }
  // setelah ganti chapter / muncul, sembunyikan lagi kecuali user tap
  if (show && autoHideMs !== 0) {
    const ms = typeof autoHideMs === "number" ? autoHideMs : 2200;
    _readerUiTimer = setTimeout(() => setReaderUi(false, 0), ms);
  }
}

async function openChapter(idx){
  const chapters = state.chapters;
  if (!chapters.length || idx < 0 || idx >= chapters.length) return;
  state.chapIdx = idx;
  const ch = chapters[idx];
  const item = state.item;
  pages.reader.classList.remove("hidden");
  document.body.classList.add("reading");
  setReaderUi(true, 2200); // tampil sebentar, lalu hilang sampai di-tap
  $("readerTitle").textContent = ch.judul || ("Chapter " + (ch.number ?? ""));
  $("readerPos").textContent = `${idx + 1} / ${chapters.length}`;
  $("readerPrev").disabled = idx >= chapters.length - 1; // list newest-first: prev = older = higher idx
  $("readerNext").disabled = idx <= 0;
  // For newest-first: Next chapter (newer) = idx-1, Prev (older) = idx+1
  $("readerScroll").innerHTML = `<div class="loading" style="padding:40px;color:#aaa"><div class="spin"></div>Memuat halaman...</div>`;
  $("readerScroll").scrollTop = 0;

  try {
    const src = state.currentSource || item.source || "ikiru";
    const chapParam = ch.slug || ch.number || ch.id || "";
    const qs = new URLSearchParams({ source: src, slug: item.slug || "" });
    if (chapParam) qs.set("chapter", String(chapParam));
    if (ch.id) qs.set("id", String(ch.id));
    if (ch.url) qs.set("url", String(ch.url));
    const d = await api("/api/chapter?" + qs.toString());
    const images = d.images || d.gambar || [];
    if (!images.length) throw new Error("Gambar kosong");
    $("readerScroll").innerHTML = images.map(src => `<img src="${escapeHtml(coverUrl(src) || src)}" alt="" loading="lazy" decoding="async" />`).join("");
    pushHistory(item, ch);
    setReaderUi(true, 2000);
  } catch (e) {
    $("readerScroll").innerHTML = `<div class="empty" style="padding:40px">Gagal memuat chapter: ${escapeHtml(e.message)}</div>`;
  }
}

const LS_SESSION = "pt_session_v1";
function saveSession(){
  try {
    const payload = {
      tab: state.tab,
      source: state.source,
      currentSource: state.currentSource,
      from: state.from,
      item: state.item ? {
        slug: state.item.slug,
        judul: state.item.judul || state.item.title,
        thumbnail: state.item.thumbnail,
        type: state.item.type,
        source: state.item.source || state.currentSource
      } : null,
      chapIdx: state.chapIdx,
      searchQ: ($("searchInput") && $("searchInput").value) || ""
    };
    localStorage.setItem(LS_SESSION, JSON.stringify(payload));
  } catch (e) {}
}

}

function openChapterSheet(){

  const chapters = state.chapters || [];

    const on = i === cur ? " on" : "";

    const numHtml = num ? `<span class="num">${escapeHtml(num)}</span>` : "";
    return `<button type="button" data-chi="${i}" class="${on}">${escapeHtml(formatChapTitle(ch))}${numHtml}</button>`;
  }).join("") || "<p style='opacity:.6;padding:12px'>Tidak ada chapter</p>";
  list.querySelectorAll("[data-chi]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const i = Number(btn.dataset.chi);
      closeChapterSheet();
      openChapter(i);
    });
  });
  sheet.classList.remove("hidden");
  sheet.setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => {
    const onBtn = list.querySelector("button.on");
    if (onBtn) {
      try { onBtn.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { onBtn.scrollIntoView(); }
    }
  });
}
function closeChapterSheet(){
  const sheet = $("chapterSheet");
  if (!sheet) return;
  sheet.classList.add("hidden");
  sheet.setAttribute("aria-hidden", "true");
}
(function(){
  const btn = $("readerListBtn");
  if (btn) {
    btn.onclick = null;
    btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openChapterSheet(); });
  }
  const c = $("chapterSheetClose");
  if (c) {
    c.onclick = null;
    c.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); closeChapterSheet(); });
  }
  const b = $("chapterSheetBackdrop");
  if (b) b.addEventListener("click", (e) => { e.preventDefault(); closeChapterSheet(); });
  const panel = document.querySelector(".chapter-sheet-panel");
  if (panel) panel.addEventListener("click", (e) => e.stopPropagation());
})();

const _origOpenChapter = openChapter;
openChapter = async function(idx){
  await _origOpenChapter(idx);
  saveSession();
};

(async function boot(){
  try {
    const s = loadSession();
    if (s && s.source) state.source = s.source;
    if (s && s.currentSource) state.currentSource = s.currentSource;
    if (s && s.searchQ && $("searchInput")) $("searchInput").value = s.searchQ;
    if (s && s.source) {
      document.querySelectorAll("#sourceChips .chip").forEach(c => {
        c.classList.toggle("on", c.dataset.source === s.source);
      });
    }
    if (s && s.item && s.item.slug && (s.tab === "detail" || s.tab === "reader")) {
      state.from = s.from || "home";
      await openDetail(s.item, { from: s.from || "home" });
      if (s.tab === "reader" && typeof s.chapIdx === "number" && s.chapIdx >= 0) {
        await openChapter(s.chapIdx);
      }
      return;
    }
    if (s && s.tab === "search" && s.searchQ && s.searchQ.length >= 1) {
      await doSearch(s.searchQ);
      return;
    }
    if (s && s.tab === "history") { showPage("history"); renderHistory(); return; }
    if (s && s.tab === "saved") { showPage("saved"); renderSaved(); return; }
    await loadHome();
  } catch (e) {
    console.error(e);
    const el = $("homeLoading"); if (el) el.classList.add("hidden");
    try { await loadHome(); } catch (e2) {}
  }
})();

</script>

<div id="chapterSheet" class="chapter-sheet hidden" aria-hidden="true">
  <div class="chapter-sheet-backdrop" id="chapterSheetBackdrop"></div>
  <div class="chapter-sheet-panel">
    <div class="chapter-sheet-head">
      <b>Daftar Chapter</b>
      <button type="button" id="chapterSheetClose" class="icon-btn subtle" aria-label="Tutup">✕</button>
    </div>
    <div id="chapterSheetList" class="chapter-sheet-list"></div>
  </div>
</div>

</body>
</html>
