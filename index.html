<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nat-KomikEksperiment</title>
  <meta name="theme-color" content="#12100e" />
  <style>
    :root {
      --bg: #12100e;
      --surface: #1c1916;
      --surface2: #25211d;
      --border: #3a342c;
      --text: #f3ebe0;
      --muted: #9c9080;
      --accent: #e0b27a;
      --accent-dim: #c49a5f;
      --danger: #e07a5f;
      --ok: #7cb89a;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18,16,14,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 12px;
    }
    .topbar-inner {
      max-width: 1080px;
      margin: 0 auto;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .logo-svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .brand-text {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .2px;
    }
    .brand-text span { color: var(--accent); }
    .brand-sub {
      font-size: .68rem;
      color: var(--muted);
      margin-top: 1px;
    }
    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .source-select, .search-input {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      outline: none;
    }
    .source-select {
      min-width: 120px;
      max-width: 140px;
      cursor: pointer;
    }
    .search-input {
      flex: 1;
      min-width: 0;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus, .source-select:focus {
      border-color: var(--accent-dim);
    }
    .btn {
      height: 40px;
      min-width: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .12s, opacity .12s;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #1a140e;
    }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-icon {
      padding: 0;
      width: 40px;
    }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ===== MAIN ===== */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 14px 80px;
    }
    .status {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 1.1em;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }

    /* ===== GRID CARDS ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-dim);
      box-shadow: var(--shadow);
    }
    .card-cover {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--surface2);
      overflow: hidden;
    }
    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-cover .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-cover .placeholder svg { width: 36px; height: 36px; opacity: .5; }
    .card-body {
      padding: 9px 10px 11px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .card-title {
      font-size: .8rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: .68rem;
      color: var(--muted);
      margin-top: auto;
    }

    /* ===== DETAIL ===== */
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .detail-top {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-cover-wrap {
      flex-shrink: 0;
      width: 130px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface2);
      aspect-ratio: 3 / 4;
    }
    @media (min-width: 600px) {
      .detail-cover-wrap { width: 170px; }
    }
    .detail-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-info { flex: 1; min-width: 0; }
    .detail-info h1 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .detail-meta {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .genre-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .genre {
      font-size: .68rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .synopsis {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.55;
      max-height: 4.6em;
      overflow: hidden;
      transition: max-height .3s ease;
    }
    .synopsis.expanded { max-height: 40em; }
    .synopsis-toggle {
      background: none;
      border: none;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      padding: 0;
    }

    .section-title {
      font-size: .9rem;
      font-weight: 600;
      margin: 18px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg { width: 16px; height: 16px; color: var(--accent); }

    .chap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
    }
    .chap-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 6px;
      font-size: .78rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: border-color .12s, color .12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chap-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== READER ===== */
    .reader-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(18,16,14,.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reader-title {
      flex: 1;
      font-size: .88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0a0908;
    }
    .pages img {
      width: 100%;
      max-width: 780px;
      height: auto;
      display: block;
      vertical-align: top;
    }
    .reader-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: rgba(18,16,14,.96);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .reader-nav .btn { flex: 1; max-width: 180px; }

    /* ===== STATES ===== */
    .empty, .loader {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: .9rem;
    }
    .loader svg {
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
      color: var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      padding: 0;
    }
    .back-btn svg { width: 16px; height: 16px; }

    footer {
      text-align: center;
      padding: 20px 14px 40px;
      font-size: .72rem;
      color: var(--muted);
    }

    /* hide topbar when reading */
    body.reading .topbar { display: none; }
    body.reading main { padding: 0 0 70px; max-width: none; }
  </style>
</head>
<body>

      <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>

  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <svg class="logo-svg" style="color:var(--accent)"><use href="#i-logo"/></svg>
        <div>
          <div class="brand-text">Nat<span>-Komik</span>Eksperiment</div>
          <div class="brand-sub">Uji coba API Sanka • Multi-source</div>
        </div>
      </div>
      <div class="search-row">
        <select id="source" class="source-select">
          <option value="komiku">Komiku</option>
          <option value="kiryuu">Kiryuu</option>
          <option value="komikindo">Komikindo</option>
          <option value="komikstation">Komikstation</option>
          <option value="bacakomik">BacaKomik</option>
          <option value="mangakita">Mangakita</option>
          <option value="westmanga">Westmanga</option>
          <option value="shinigami">Shinigami</option>
          <option value="soulscans">SoulScans</option>
          <option value="maid">Maid</option>
        </select>
        <input id="q" class="search-input" type="search" placeholder="Cari judul komik..." autocomplete="off" />
        <button id="btnSearch" class="btn btn-primary btn-icon" title="Cari">
          <svg><use href="#i-search"/></svg>
        </button>
        <button id="btnHome" class="btn btn-ghost btn-icon" title="Home">
          <svg><use href="#i-home"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status">Siap. Pilih source lalu tekan Home / Cari.</div>

    <!-- LIST -->
    <section id="listPanel" class="panel active">
      <div id="grid" class="grid"></div>
    </section>

    <!-- DETAIL -->
    <section id="detailPanel" class="panel">
      <button class="back-btn" id="backList">
        <svg><use href="#i-back"/></svg> Kembali
      </button>
      <div class="detail-top">
        <div class="detail-cover-wrap">
          <img id="dCover" alt="" />
        </div>
        <div class="detail-info">
          <h1 id="dTitle">-</h1>
          <div class="detail-meta" id="dMeta"></div>
          <div class="genre-list" id="dGenres"></div>
          <div class="synopsis" id="dSynopsis"></div>
          <button class="synopsis-toggle" id="synopsisToggle" style="display:none">Selengkapnya</button>
        </div>
      </div>
      <div class="section-title">
        <svg><use href="#i-list"/></svg>
        Daftar Chapter
      </div>
      <div id="chapList" class="chap-grid"></div>
    </section>

    <!-- READER -->
    <section id="readerPanel" class="panel">
      <div class="reader-bar">
        <button class="btn btn-ghost btn-icon" id="backDetail" title="Kembali">
          <svg><use href="#i-back"/></svg>
        </button>
        <div class="reader-title" id="rTitle">Chapter</div>
      </div>
      <div id="pages" class="pages"></div>
      <div class="reader-nav">
        <button id="prevChap" class="btn btn-ghost">
          <svg><use href="#i-prev"/></svg> Prev
        </button>
        <button id="nextChap" class="btn btn-primary">
          Next <svg><use href="#i-next"/></svg>
        </button>
      </div>
    </section>
  </main>

  <footer>Nat-KomikEksperiment • API Sanka • By Nat</footer>

  <script>
    const BASES = [
      "https://www.sankavollerei.web.id",
      "https://www.sankavollerei.com"
    ];
    let currentBase = BASES[0];

    const state = {
      source: "komiku",
      list: [],
      detail: null,
      chapters: [],
      currentChapIdx: -1,
      slug: null
    };

    const $ = s => document.querySelector(s);
    const statusEl = $("#status");
    const grid = $("#grid");

    function setStatus(msg, type = "") {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function showPanel(id) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      $(id).classList.add("active");
      document.body.classList.toggle("reading", id === "#readerPanel");
      window.scrollTo(0, 0);
    }

    async function api(path) {
      let lastErr;
      for (const base of BASES) {
        try {
          const r = await fetch(base + path, {
            headers: { "Accept": "application/json" }
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const data = await r.json();
          currentBase = base;
          return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("Semua base gagal");
    }

    function pick(obj, keys, fallback = "") {
      if (!obj) return fallback;
      for (const k of keys) {
        if (obj[k] != null && obj[k] !== "") return obj[k];
      }
      return fallback;
    }

    function pickCover(item) {
      return pick(item, ["thumbnail", "cover", "image", "thumb", "img", "poster", "cover_url"]);
    }

    function pickTitle(item) {
      return pick(item, ["title", "name", "judul", "manga_title"], "Tanpa Judul");
    }

    function pickSlug(item) {
      let s = pick(item, ["slug", "endpoint", "id", "url", "manga_slug", "path"], "");
      if (typeof s === "string" && s.includes("http")) {
        try {
          const parts = new URL(s).pathname.split("/").filter(Boolean);
          s = parts[parts.length - 1] || s;
        } catch (_) {}
      }
      return String(s).replace(/^\/+|\/+$/g, "");
    }

    function normalizeList(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;
      const keys = ["data", "comics", "manga", "result", "list", "items", "results"];
      for (const k of keys) {
        if (Array.isArray(data[k])) return data[k];
      }
      for (const k of Object.keys(data)) {
        if (Array.isArray(data[k]) && data[k].length && typeof data[k][0] === "object") {
          return data[k];
        }
      }
      return [];
    }

    function loaderHTML() {
      return `<div class="loader"><svg><use href="#i-spin"/></svg><div>Memuat...</div></div>`;
    }

    function renderCards(items) {
      grid.innerHTML = "";
      if (!items.length) {
        grid.innerHTML = `<div class="empty">Tidak ada data.<br>Coba source atau kata kunci lain.</div>`;
        return;
      }
      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const cover = pickCover(item);
        const title = pickTitle(item);
        const slug = pickSlug(item);
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-cover">
            ${cover
              ? `<img src="${cover}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                 <div class="placeholder" style="display:none"><svg><use href="#i-img"/></svg></div>`
              : `<div class="placeholder"><svg><use href="#i-img"/></svg></div>`
            }
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-meta">${state.source}</div>
          </div>`;
        card.addEventListener("click", () => openDetail(slug || item, item));
        frag.appendChild(card);
      });
      grid.appendChild(frag);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadHome() {
      state.source = $("#source").value;
      setStatus(`Memuat home (${state.source})...`);
      grid.innerHTML = loaderHTML();
      showPanel("#listPanel");
      try {
        const paths = [
          `/comic/${state.source}/home`,
          `/comic/${state.source}/latest`,
          `/comic/homepage`,
          `/comic/terbaru`,
          `/comic/${state.source}/popular`
        ];
        let items = [];
        for (const path of paths) {
          try {
            const data = await api(path);
            items = normalizeList(data);
            if (items.length) break;
          } catch (_) {}
        }
        state.list = items;
        renderCards(items);
        setStatus(items.length
          ? `Home • ${state.source} • ${items.length} komik`
          : `Tidak ada data dari ${state.source}`,
          items.length ? "ok" : "err");
      } catch (e) {
        setStatus("Gagal: " + e.message, "err");
        grid.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function doSearch() {
      const q = $("#q").value.trim();
      if (!q) return loadHome();
      state.source = $("#source").value;
      setStatus(`Mencari "${q}"...`);
      grid.innerHTML = loaderHTML();
      showPanel("#listPanel");
      try {
        const paths = [
          `/comic/${state.source}/search/${encodeURIComponent(q)}`,
          `/comic/search?q=${encodeURIComponent(q)}`,
          `/comic/${state.source}/search?q=${encodeURIComponent(q)}`
        ];
        let items = [];
        for (const path of paths) {
          try {
            const data = await api(path);
            items = normalizeList(data);
            if (items.length) break;
          } catch (_) {}
        }
        state.list = items;
        renderCards(items);
        setStatus(items.length
          ? `Hasil "${q}" • ${items.length} item`
          : `Tidak ditemukan: ${q}`,
          items.length ? "ok" : "err");
      } catch (e) {
        setStatus("Gagal search: " + e.message, "err");
        grid.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    async function openDetail(slugOrItem, raw) {
      let slug = typeof slugOrItem === "string" ? slugOrItem : pickSlug(slugOrItem);
      slug = String(slug).replace(/^\/+|\/+$/g, "");
      state.slug = slug;

      setStatus("Memuat detail...");
      showPanel("#detailPanel");
      $("#dTitle").textContent = "Memuat...";
      $("#dCover").removeAttribute("src");
      $("#dMeta").textContent = "";
      $("#dGenres").innerHTML = "";
      $("#dSynopsis").textContent = "";
      $("#dSynopsis").classList.remove("expanded");
      $("#synopsisToggle").style.display = "none";
      $("#chapList").innerHTML = loaderHTML();

      try {
        const paths = [
          `/comic/${state.source}/manga/${encodeURIComponent(slug)}`,
          `/comic/comic/${encodeURIComponent(slug)}`,
          `/comic/${state.source}/detail/${encodeURIComponent(slug)}`
        ];
        let data = null;
        for (const path of paths) {
          try {
            data = await api(path);
            if (data && (data.title || data.data || data.manga || data.chapters || data.synopsis)) break;
          } catch (_) {}
        }
        if (!data) throw new Error("Detail tidak ditemukan");

        const info = data.data || data.manga || data.comic || data;
        const title = pickTitle(info) || pickTitle(raw) || slug;
        const cover = pickCover(info) || pickCover(raw);
        const synopsis = pick(info, ["synopsis", "description", "sinopsis", "summary", "desc"], "-");
        let genres = info.genres || info.genre || [];
        if (typeof genres === "string") genres = genres.split(",").map(s => s.trim()).filter(Boolean);
        if (!Array.isArray(genres)) genres = [];

        let chapters = info.chapters || info.chapter || data.chapters || data.chapter_list || [];
        if (!Array.isArray(chapters)) chapters = [];
        chapters = chapters.map((c, i) => ({
          title: pick(c, ["title", "name", "chapter", "chapter_title"], `Ch. ${c.number || i + 1}`),
          slug: pickSlug(c) || pick(c, ["chapter_slug", "chapter_id"], ""),
          number: c.number ?? c.chapter ?? i + 1
        })).filter(c => c.slug);

        // urutkan chapter terbaru di atas jika memungkinkan
        if (chapters.length > 1) {
          const nums = chapters.map(c => parseFloat(String(c.number).replace(/[^\d.]/g, "")) || 0);
          if (nums[0] < nums[nums.length - 1]) chapters = chapters.reverse();
        }

        state.detail = info;
        state.chapters = chapters;

        $("#dTitle").textContent = title;
        if (cover) {
          $("#dCover").src = cover;
          $("#dCover").referrerPolicy = "no-referrer";
        }
        $("#dMeta").textContent = `${state.source}  ·  ${chapters.length} chapter`;
        $("#dGenres").innerHTML = genres
          .map(g => `<span class="genre">${escapeHtml(typeof g === "object" ? (g.name || g) : g)}</span>`)
          .join("");

        const synEl = $("#dSynopsis");
        synEl.textContent = synopsis;
        synEl.classList.remove("expanded");
        const toggle = $("#synopsisToggle");
        // cek apakah perlu tombol selengkapnya
        requestAnimationFrame(() => {
          if (synEl.scrollHeight > synEl.clientHeight + 4) {
            toggle.style.display = "inline";
            toggle.textContent = "Selengkapnya";
          } else {
            toggle.style.display = "none";
          }
        });

        const listEl = $("#chapList");
        listEl.innerHTML = "";
        if (!chapters.length) {
          listEl.innerHTML = `<div class="empty">Tidak ada daftar chapter</div>`;
        } else {
          const frag = document.createDocumentFragment();
          chapters.forEach((c, idx) => {
            const btn = document.createElement("button");
            btn.className = "chap-btn";
            btn.textContent = c.title;
            btn.title = c.title;
            btn.addEventListener("click", () => openChapter(idx));
            frag.appendChild(btn);
          });
          listEl.appendChild(frag);
        }
        setStatus(`Detail • ${title}`, "ok");
      } catch (e) {
        setStatus("Gagal detail: " + e.message, "err");
        $("#dTitle").textContent = "Gagal memuat";
        $("#dSynopsis").textContent = e.message;
        $("#chapList").innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
      }
    }

    async function openChapter(idx) {
      const chap = state.chapters[idx];
      if (!chap) return;
      state.currentChapIdx = idx;
      showPanel("#readerPanel");
      $("#rTitle").textContent = chap.title;
      $("#pages").innerHTML = loaderHTML();
      setStatus("Memuat chapter...");

      try {
        let slug = chap.slug;
        const paths = [
          `/comic/${state.source}/chapter/${encodeURIComponent(slug)}`,
          `/comic/chapter/${encodeURIComponent(slug)}`
        ];
        let data = null;
        for (const path of paths) {
          try {
            data = await api(path);
            if (data) break;
          } catch (_) {}
        }
        if (!data) throw new Error("Chapter tidak ditemukan");

        let images = data.images || data.pages || data.chapter?.images
          || data.data?.images || data.data?.pages || data.data || [];
        if (!Array.isArray(images)) images = [];
        images = images
          .map(img => typeof img === "string" ? img : (img.url || img.src || img.image || img.link || ""))
          .filter(Boolean);

        const box = $("#pages");
        box.innerHTML = "";
        if (!images.length) {
          box.innerHTML = `<div class="empty">Tidak ada gambar di chapter ini</div>`;
        } else {
          const frag = document.createDocumentFragment();
          images.forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy";
            img.referrerPolicy = "no-referrer";
            img.alt = "";
            img.onerror = () => { img.style.display = "none"; };
            frag.appendChild(img);
          });
          box.appendChild(frag);
        }
        setStatus(`Chapter • ${chap.title} • ${images.length} halaman`, "ok");
        updateNavButtons();
      } catch (e) {
        setStatus("Gagal chapter: " + e.message, "err");
        $("#pages").innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
      }
    }

    function updateNavButtons() {
      const prev = $("#prevChap");
      const next = $("#nextChap");
      const atStart = state.currentChapIdx <= 0;
      const atEnd = state.currentChapIdx >= state.chapters.length - 1;
      prev.disabled = atStart;
      next.disabled = atEnd;
      prev.style.opacity = atStart ? .4 : 1;
      next.style.opacity = atEnd ? .4 : 1;
    }

    // Events
    $("#btnHome").addEventListener("click", loadHome);
    $("#btnSearch").addEventListener("click", doSearch);
    $("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
    $("#source").addEventListener("change", loadHome);
    $("#backList").addEventListener("click", () => {
      showPanel("#listPanel");
      setStatus("Daftar komik");
    });
    $("#backDetail").addEventListener("click", () => showPanel("#detailPanel"));
    $("#prevChap").addEventListener("click", () => {
      if (state.currentChapIdx > 0) openChapter(state.currentChapIdx - 1);
    });
    $("#nextChap").addEventListener("click", () => {
      if (state.currentChapIdx < state.chapters.length - 1) openChapter(state.currentChapIdx + 1);
    });
    $("#synopsisToggle").addEventListener("click", () => {
      const el = $("#dSynopsis");
      const btn = $("#synopsisToggle");
      const open = el.classList.toggle("expanded");
      btn.textContent = open ? "Sembunyikan" : "Selengkapnya";
    });

    // Boot
    loadHome();
  </script>
</body>
</html>
